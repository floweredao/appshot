name: Appshot
options:
  bundleIdPrefix: com.floweredao
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  AppshotCore:
    path: Packages/AppshotCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  Appshot:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources
    dependencies:
      - package: AppshotCore
    info:
      path: .work/Info.plist
      properties:
        CFBundleDisplayName: Appshot
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "3"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: MIT License
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ko]
        CFBundleIconName: AppIcon
        NSAppleEventsUsageDescription: Appshot asks your browser or terminal for the full text of the front window.
    entitlements:
      path: Config/Appshot.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.floweredao.appshot
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        DEAD_CODE_STRIPPING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
schemes:
  Appshot:
    build:
      targets:
        Appshot: all
